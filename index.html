<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World · MyFirstSandBox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="blobs" aria-hidden="true">
        <span class="blob blob-1"></span>
        <span class="blob blob-2"></span>
        <span class="blob blob-3"></span>
    </div>
    <div class="noise" aria-hidden="true"></div>

    <header class="topbar">
        <div class="brand"><span class="brand-dot"></span>MyFirstSandBox</div>
        <div class="topbar-right">
            <h1 class="topbar-title fade-up">Hello <span class="gradient">World</span> 👋</h1>
            <div class="clock glass fade-up delay-1">
                <span class="clock-date" id="clock-date"></span>
                <span class="clock-time"><span id="clock-hm">--:--</span><span class="clock-colon">:</span><span class="clock-sec" id="clock-sec">--</span></span>
            </div>
        </div>
    </header>

    <main class="container">
        <nav class="theme-menu glass fade-up delay-2" id="theme-menu" aria-label="Choisir un thème">
            <span class="menu-indicator" id="menu-indicator" aria-hidden="true"></span>
        </nav>

        <div class="ticker glass fade-up delay-3" id="ticker" aria-label="Fil défilant des faits marquants">
            <span class="ticker-label"><span class="pulse-dot"></span>En direct</span>
            <div class="ticker-viewport">
                <div class="ticker-track" id="ticker-track"></div>
            </div>
        </div>

        <section class="news glass fade-up delay-4">
            <div class="news-header">
                <div class="news-heading">
                    <p class="kicker"><span class="pulse-dot"></span>En direct</p>
                    <h2 id="news-title">Les 3 faits marquants du jour</h2>
                </div>
                <p class="updated" id="updated"></p>
            </div>
            <div id="news-list" class="news-list">
                <p class="loading">Chargement des actualités…</p>
            </div>
        </section>
    </main>

    <footer class="footer">Actualités mises à jour automatiquement chaque jour · GitHub Pages</footer>

    <script>
        const THEME_ORDER = ["monde", "art", "culture", "high-tech", "nature", "sante", "sport"];

        const dateEl = document.getElementById("clock-date");
        const hmEl = document.getElementById("clock-hm");
        const secEl = document.getElementById("clock-sec");
        const menuEl = document.getElementById("theme-menu");
        const indicatorEl = document.getElementById("menu-indicator");
        const titleEl = document.getElementById("news-title");
        const listEl = document.getElementById("news-list");
        const updatedEl = document.getElementById("updated");

        function pad(n) {
            return String(n).padStart(2, "0");
        }

        function tick() {
            const now = new Date();
            dateEl.textContent = now.toLocaleDateString("fr-FR", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });
            hmEl.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
            secEl.textContent = pad(now.getSeconds());
            secEl.classList.remove("tick");
            void secEl.offsetWidth;
            secEl.classList.add("tick");
        }
        tick();
        setInterval(tick, 1000);

        const tickerEl = document.getElementById("ticker");
        const tickerTrack = document.getElementById("ticker-track");
        let lastUpdatedAt = null;

        function buildTicker(theme) {
            const items = theme && theme.items ? theme.items : [];
            tickerTrack.innerHTML = "";
            if (items.length === 0) {
                tickerEl.style.display = "none";
                return;
            }
            tickerEl.style.display = "";
            const icon = theme ? [...theme.label][0] : "📰";
            const makeSeq = () => {
                const seq = document.createElement("span");
                seq.className = "ticker-seq";
                items.forEach((item) => {
                    const a = document.createElement("a");
                    a.className = "ticker-item";
                    a.href = item.link;
                    a.target = "_blank";
                    a.rel = "noopener";
                    a.textContent = icon + " " + item.title;
                    seq.appendChild(a);
                    const sep = document.createElement("span");
                    sep.className = "ticker-sep";
                    sep.textContent = "◆";
                    seq.appendChild(sep);
                });
                return seq;
            };
            tickerTrack.appendChild(makeSeq());
            tickerTrack.appendChild(makeSeq());
            const halfWidth = tickerTrack.scrollWidth / 2;
            tickerTrack.style.animationDuration = Math.max(18, Math.round(halfWidth / 65)) + "s";
        }

        let newsData = null;
        let activeTheme = localStorage.getItem("theme") || "monde";

        function moveIndicator(btn) {
            if (!btn) return;
            indicatorEl.style.width = btn.offsetWidth + "px";
            indicatorEl.style.height = btn.offsetHeight + "px";
            indicatorEl.style.transform = "translate(" + btn.offsetLeft + "px, " + btn.offsetTop + "px)";
        }

        function activeButton() {
            return menuEl.querySelector('.theme-btn[data-theme="' + activeTheme + '"]');
        }

        function renderTheme(key) {
            const theme = newsData.themes[key];
            menuEl.querySelectorAll(".theme-btn").forEach((b) => {
                b.classList.toggle("active", b.dataset.theme === key);
            });
            moveIndicator(activeButton());
            buildTicker(theme);
            titleEl.textContent = (theme ? theme.label : "📰") + " — Les 3 faits marquants du jour";
            const icon = theme ? [...theme.label][0] : "📰";
            listEl.innerHTML = "";
            const items = theme && theme.items ? theme.items : [];
            if (items.length === 0) {
                listEl.innerHTML = '<p class="loading">Actualités indisponibles pour le moment.</p>';
                return;
            }
            items.forEach((item, i) => {
                const card = document.createElement("a");
                card.className = "news-card fade-up";
                card.href = item.link;
                card.target = "_blank";
                card.rel = "noopener";
                card.style.animationDelay = i * 0.08 + "s";
                const thumb = document.createElement("span");
                thumb.className = "news-thumb";
                if (item.image) {
                    const img = document.createElement("img");
                    img.src = item.image;
                    img.alt = "";
                    img.loading = "lazy";
                    img.onerror = () => { thumb.textContent = icon; };
                    thumb.appendChild(img);
                } else {
                    thumb.textContent = icon;
                }
                const body = document.createElement("span");
                body.className = "news-body";
                const title = document.createElement("span");
                title.className = "news-title";
                title.textContent = item.title;
                const meta = document.createElement("span");
                meta.className = "news-meta";
                const num = document.createElement("span");
                num.className = "news-num";
                num.textContent = pad(i + 1);
                meta.appendChild(num);
                let host = "";
                try { host = new URL(item.link).hostname.replace(/^www\./, ""); } catch (e) {}
                if (host) {
                    const dot = document.createElement("span");
                    dot.className = "meta-dot";
                    dot.textContent = "·";
                    const src = document.createElement("span");
                    src.textContent = host;
                    meta.appendChild(dot);
                    meta.appendChild(src);
                }
                body.appendChild(title);
                body.appendChild(meta);
                const arrow = document.createElement("span");
                arrow.className = "news-arrow";
                arrow.textContent = "↗";
                card.appendChild(thumb);
                card.appendChild(body);
                card.appendChild(arrow);
                listEl.appendChild(card);
            });
        }
        fetch("news.json")
            .then((r) => r.json())
            .then((data) => {
                newsData = data;
                lastUpdatedAt = data.updated_at || null;
                THEME_ORDER.forEach((key) => {
                    const theme = data.themes[key];
                    if (!theme) return;
                    const btn = document.createElement("button");
                    btn.className = "theme-btn";
                    btn.type = "button";
                    btn.textContent = theme.label;
                    btn.dataset.theme = key;
                    btn.addEventListener("click", () => {
                        activeTheme = key;
                        localStorage.setItem("theme", key);
                        renderTheme(key);
                    });
                    menuEl.appendChild(btn);
                });
                if (!data.themes[activeTheme]) activeTheme = THEME_ORDER[0];
                renderTheme(activeTheme);
                if (data.updated_at) {
                    updatedEl.textContent =
                        "Mis à jour le " + new Date(data.updated_at).toLocaleString("fr-FR");
                }
                window.addEventListener("resize", () => moveIndicator(activeButton()));
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(() => moveIndicator(activeButton()));
                }
                setInterval(() => {
                    fetch("news.json?v=" + Date.now())
                        .then((r) => r.json())
                        .then((data) => {
                            if (data.updated_at && data.updated_at !== lastUpdatedAt) {
                                lastUpdatedAt = data.updated_at;
                                newsData = data;
                                renderTheme(activeTheme);
                                updatedEl.textContent =
                                    "Mis à jour le " + new Date(data.updated_at).toLocaleString("fr-FR");
                            }
                        })
                        .catch(() => {});
                }, 60000);
            })
            .catch(() => {
                listEl.innerHTML = '<p class="loading">Actualités indisponibles pour le moment.</p>';
            });
    </script>
</body>
</html>
